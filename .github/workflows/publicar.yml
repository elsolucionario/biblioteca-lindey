# Genera el sitio con build.py y lo publica en GitHub Pages
# cada vez que se sube un cambio a la rama main.
name: Publicar Biblioteca Lindey

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow (miniaturas)
        run: pip install -r requirements.txt
      - name: Instalar Poppler (páginas de los PDF)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Instalar LibreOffice (solo si hay archivos Word)
        if: hashFiles('pdfs/*.docx', 'pdfs/*.doc', 'pdfs/*.odt', 'pdfs/*.rtf') != ''
        # libreoffice-math es necesario: sin él, las ecuaciones de Word desaparecen al convertir a PDF
        run: sudo apt-get install -y -qq --no-install-recommends libreoffice-writer libreoffice-math
      - name: Guardar el sitemap publicado antes de este cambio (para IndexNow)
        run: curl -sf https://solucionariouni.com/sitemap.xml -o /tmp/sitemap_anterior.xml || echo '<urlset/>' > /tmp/sitemap_anterior.xml
      - name: Generar el sitio
        run: python build.py
      - name: Lista de páginas nuevas o modificadas
        id: indexnow
        run: echo "urls=$(python herramientas/indexnow.py lista /tmp/sitemap_anterior.xml _site/sitemap.xml)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5

  avisar-buscadores:
    # IndexNow: avisa a Bing (y a los buscadores que lo usan) de lo publicado. No afecta a Google.
    needs: [construir, publicar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar a IndexNow
        env:
          URLS: ${{ needs.construir.outputs.urls }}
        run: python herramientas/indexnow.py enviar "$URLS"
